<!doctype html><meta charset="utf-8"><title>LOOT header</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1500px;height:500px;overflow:hidden;position:relative;font-family:Outfit,sans-serif;
background:linear-gradient(#12062b 0%,#3a0b6b 28%,#c4237f 58%,#ff6a3d 78%,#ffb400 100%)}
.sun{position:absolute;right:170px;top:38px;width:330px;height:330px;border-radius:50%;
background:linear-gradient(#ffd36b,#ff8a2b 45%,#ff2e93);
-webkit-mask:repeating-linear-gradient(#000 0 22px,transparent 22px 27px);mask:repeating-linear-gradient(#000 0 22px,transparent 22px 27px);
-webkit-mask-composite:source-over;filter:drop-shadow(0 0 40px #ff2e93)}
.sun::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#c4237f 55%);mix-blend-mode:normal;opacity:0}
.city{position:absolute;left:0;right:0;bottom:130px;height:120px;
background:
linear-gradient(90deg,transparent 0 0),
repeating-linear-gradient(90deg,#1d0638 0 46px,transparent 46px 52px,#1d0638 52px 118px,transparent 118px 124px,#1d0638 124px 176px,transparent 176px 180px);
-webkit-mask:linear-gradient(#000,#000);opacity:.0}
.floor{position:absolute;left:0;right:0;bottom:0;height:150px;background:#12062b;
background-image:linear-gradient(#ff2e93 2px,transparent 2px),linear-gradient(90deg,#19e3d1 2px,transparent 2px);
background-size:100% 30px,60px 100%;transform-origin:top;border-top:3px solid #19e3d1;
box-shadow:0 -8px 40px #19e3d1aa}
.floor::after{content:"";position:absolute;inset:0;background:linear-gradient(#12062b00,#12062b)}
.title{position:absolute;left:430px;top:105px;font-family:Bungee;font-size:190px;line-height:1;letter-spacing:6px;
background:linear-gradient(#fff0fa 10%,#ff2e93 55%,#ffb400);-webkit-background-clip:text;color:transparent;
filter:drop-shadow(8px 8px 0 #7b2cff) drop-shadow(0 0 28px #ff2e9399)}
.tag{position:absolute;left:438px;top:316px;font-family:Bungee;font-size:34px;letter-spacing:5px;color:#fff0fa;
text-shadow:0 0 14px #19e3d1,3px 3px 0 #12062b}
.tag b{color:#19e3d1;font-weight:400}
.chip{position:absolute;left:438px;top:372px;padding:8px 18px;border-radius:99px;border:3px solid #19e3d1;background:#12062bcc;
font-weight:800;font-size:24px;color:#ffd36b;letter-spacing:2px}
.vi{position:absolute;right:40px;top:30px;font-family:Bungee;font-size:30px;color:#fff0fa;padding:6px 14px;border-radius:10px;
background:linear-gradient(135deg,#ff8a2b,#ff2e93);box-shadow:0 0 20px #ff2e93}
.stars{position:absolute;right:40px;bottom:36px;font-size:44px;color:#ffb400;letter-spacing:6px;text-shadow:0 0 16px #ff8a2b}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 3px,#0000002a 3px 4px)}
</style>
<div class="sun"></div><div class="floor"></div>
<div class="title">LOOT</div>
<div class="tag">CRACK THE STASH <b>///</b> CHECK THE SCORE</div>
<div class="chip">$LOOT · SOLANA TOKEN CHECKER · LEONIDA EDITION</div>
<div class="vi">VI</div><div class="stars">★★★★★</div>
<div class="scan"></div>
